# Homio Dashboard YAML panel — Daylor rooms (Homio Fixed parity).
# Templates stay !included (portable SoT). Site-specific entities live here.
# Homio Fixed (url_path=homio-fixed) remains the daily driver until Phase 4 cutover.
#
# Paths use /homio_dashboard/<room> (not /homio-fixed/...).
# Room JPGs must exist under www/images/Homio/rooms/{lounge,dining,kitchen,office,bedroom}.jpg

kiosk_mode:
  hide_header: true

button_card_templates: !include_dir_merge_named ../dashboards/templates/button_cards

views:
  - type: custom:grid-layout
    title: Living
    path: living
    theme: homio
    layout: !include ../dashboards/templates/includes/homio_screen_layout.yaml
    cards:
      - type: custom:button-card
        template:
          - homio_room
        name: Living Room
        variables:
          image: lounge
          image_position: center center
          show_temp: true
          show_humid: true
          show_motion: false
          motion_sensor: null
          temp_sensor: climate.thermostat
          humid_sensor: sensor.thermostat_humidity
        custom_fields:
          entities:
            card:
              type: custom:layout-card
              layout_type: custom:grid-layout
              layout: !include ../dashboards/templates/includes/homio_entity_layout.yaml
              cards:
                - type: custom:button-card
                  template:
                    - homio_thermostat
                  entity: climate.thermostat
                  name: Climate
                - type: custom:button-card
                  template:
                    - homio_light
                  entity: light.living_room
                  name: Main Room Light
                  variables:
                    icon: light
                - type: custom:button-card
                  template:
                    - homio_light
                  entity: light.great_room_main
                  name: Great Room Light
                  variables:
                    icon: light
                - type: custom:button-card
                  template:
                    - homio_light
                  entity: light.foyer_chandelier
                  name: Foyer Chandelier
                  variables:
                    icon: pendent
                - type: custom:button-card
                  template:
                    - homio_entity
                  entity: media_player.family_room_tv_remote
                  name: TV
                  variables:
                    icon: google_tv

