# Site-specific Daylor rooms (Homio Fixed parity). Paths target the YAML panel
# (/homio_dashboard/...), not Homio Fixed (/homio-fixed/...).
- type: custom:button-card
  template:
    - homio_nav_button
  name: Living
  variables:
    path: /homio_dashboard/living
- type: custom:button-card
  template:
    - homio_nav_button
  name: Dining
  variables:
    path: /homio_dashboard/dining
- type: custom:button-card
  template:
    - homio_nav_button
  name: Kitchen
  variables:
    path: /homio_dashboard/kitchen
- type: custom:button-card
  template:
    - homio_nav_button
  name: Office
  variables:
    path: /homio_dashboard/office
- type: custom:button-card
  template:
    - homio_nav_button
  name: Master
  variables:
    path: /homio_dashboard/master-bedroom
