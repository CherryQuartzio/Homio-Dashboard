homio_time:
  template:
    - homio_default
  show_icon: false
  show_state: false
  # Trigger minute updates; tap is configured via Homio options (default: none).
  entity: sensor.homio_current_time
  triggers_update: all
  tap_action:
    action: none
  name: |
    [[[
      const use12 = false;
      const showAmPm = true;
      const d = new Date();
      let h = d.getHours();
      const m = String(d.getMinutes()).padStart(2, '0');
      if (!use12) {
        return String(h).padStart(2, '0') + ':' + m;
      }
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      return showAmPm ? (h + ':' + m + ' ' + ampm) : (h + ':' + m);
    ]]]
  styles:
    grid:
      - grid-template-areas: '"n"'
      - grid-template-columns: 1fr
      - grid-template-rows: min-content
    name:
      - color: var(--primary-text-color)
      - letter-spacing: 1px
      - font-size: 16px
      - text-transform: uppercase
      - font-weight: 700
      - justify-self: start
    card:
      - "--ha-card-background": transparent
      - background: none
      - background-color: transparent
      - box-shadow: none
      - border: none
      - pointer-events: all
      - height: auto
      - min-height: 0
      - width: auto
      - padding: 0
      - margin: 0
      - animation: none
