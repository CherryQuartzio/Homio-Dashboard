homio_menu_icon:
  # Burger/close swap is per-browser via CSS vars from homio-menu-nav.js
  # (never input_boolean.homio_mobile_navigation — that syncs every client).
  # Burger 28×23 (aliasing-safe). Centers on DAYLOR (18px @ 60px):
  # top = 60 + (18-23)/2 = 57.5px. X is 22×22 centered in the same host.
  show_name: false
  show_icon: false
  show_state: false
  show_entity_picture: false
  tap_action:
    action: fire-dom-event
    homio_action: menu_toggle
  # extra_styles keeps burger/X swap + shared center even if style dicts flake.
  extra_styles: |
    #burger, #close {
      grid-area: i !important;
      justify-self: center !important;
      align-self: center !important;
    }
    #burger {
      display: var(--homio-menu-burger-display, block) !important;
      width: 28px !important;
      height: 23px !important;
    }
    #close {
      display: var(--homio-menu-close-display, none) !important;
      width: 22px !important;
      height: 22px !important;
    }
  styles:
    card:
      - "--ha-card-background": transparent
      - background: none
      - background-color: transparent
      - box-shadow: none
      - border: none
      - display: var(--homio-compact-ui-display, none)
      - pointer-events: all
      - cursor: pointer
      - padding: 0
      - margin: 0
      - height: 23px
      - width: 28px
      - min-height: 0
      - overflow: visible
    grid:
      - grid-template-areas: '"i"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      - height: 23px
      - width: 28px
    custom_fields:
      burger:
        - grid-area: i
        - display: var(--homio-menu-burger-display, block)
        - width: 28px
        - height: 23px
        - justify-self: center
        - align-self: center
      close:
        - grid-area: i
        - display: var(--homio-menu-close-display, none)
        - width: 22px
        - height: 22px
        - justify-self: center
        - align-self: center
  custom_fields:
    burger: |
      [[[
        return `<img src="/homio_assets/icons/menu.svg" alt="" width="28" height="23" style="width:28px;height:23px;display:block;object-fit:fill;image-rendering:crisp-edges;" />`;
      ]]]
    close: |
      [[[
        return `<img src="/homio_assets/icons/close.svg" alt="" width="22" height="22" style="width:22px;height:22px;display:block;object-fit:contain;" />`;
      ]]]
