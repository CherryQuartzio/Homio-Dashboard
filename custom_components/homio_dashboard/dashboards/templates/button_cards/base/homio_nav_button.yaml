homio_nav_button:
  template:
    - homio_default
  show_icon: false
  show_state: false
  tap_action:
    action: navigate
    navigation_path: "[[[ return variables.path || '/homio_dashboard/home' ]]]"
  styles:
    grid:
      - grid-template-areas: '"n"'
      - grid-template-columns: 1fr
      - grid-template-rows: min-content
    name:
      - color: var(--primary-text-color)
      - font-size: 15px
      - font-weight: 700
      - border-bottom: >
          [[[ return (variables.path && variables.path === window.location.pathname)
            ? '2px solid white' : 'none' ]]]
      - justify-self: start
      - white-space: nowrap
    card:
      # Homio theme sets ha-card-background rgba(10,10,10,0.4) — kill it or
      # shrink-wrapped nav links show dark boxes behind the text.
      - "--ha-card-background": transparent
      - background: none
      - background-color: transparent
      - box-shadow: none
      - border: none
      - pointer-events: all
      - height: auto
      - min-height: 0
      - width: auto
      - padding: 0
      - margin: 0
      - overflow: visible
