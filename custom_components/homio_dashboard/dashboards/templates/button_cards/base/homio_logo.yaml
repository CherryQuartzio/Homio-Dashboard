homio_logo:
  template:
    - homio_default
  tap_action:
    action: navigate
    navigation_path: /homio_dashboard/home
  # Keep in sync with homio_mobile_logo (collapsed hamburger header).
  name: Daylor
  styles:
    name:
      - color: var(--primary-text-color)
      - letter-spacing: 2px
      - font-size: 18px
      - font-weight: 700
      - text-transform: uppercase
      - justify-self: start
      - line-height: 18px
    card:
      - "--ha-card-background": transparent
      - background: none
      - background-color: transparent
      - box-shadow: none
      - border: none
      - pointer-events: all
      - height: 18px
      - min-height: 0
      - padding: 0
      - margin: 0
