homio_logo:
  # Do not template homio_default — its fadeIn makes the logo flash on room swap.
  # Stay fully visible like nav/clock (animation:none only). No opacity:0 hit-target.
  tap_action:
    action: navigate
    navigation_path: /homio_dashboard/living
  # Keep in sync with homio_mobile_logo (collapsed hamburger header).
  name: HOMIO.
  styles:
    grid:
      - grid-template-areas: '"n"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      - place-items: center start
      - height: 100%
    name:
      - color: var(--primary-text-color)
      - letter-spacing: 2px
      - font-size: 18px
      - font-weight: 700
      - text-transform: uppercase
      - justify-self: start
      - align-self: center
      - line-height: 1
      - margin: 0
      - padding: 0
    card:
      - "--mdc-ripple-color": transparent
      - "-webkit-tap-highlight-color": transparent
      - "--ha-card-background": transparent
      - background: none
      - background-color: transparent
      - box-shadow: none
      - border: none
      - border-radius: 0
      - position: relative
      - pointer-events: all
      - height: 22px
      - min-height: 22px
      - display: grid
      - align-items: center
      - padding: 0
      - margin: 0
      - animation: none
      - transition: none
      - opacity: 1
  extra_styles: |
    :host,
    ha-card,
    .button-card-main {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
    }
    #name {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
    }
