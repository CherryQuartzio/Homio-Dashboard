homio_logo:
  template:
    - homio_default
  tap_action:
    action: navigate
    navigation_path: /homio_dashboard/living
  # Keep in sync with homio_mobile_logo (collapsed hamburger header).
  name: HOMIO.
  styles:
    grid:
      - grid-template-areas: '"n"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      - place-items: center start
      - height: 100%
    name:
      - color: var(--primary-text-color)
      - letter-spacing: 2px
      - font-size: 18px
      - font-weight: 700
      - text-transform: uppercase
      - justify-self: start
      - align-self: center
      - line-height: 1
      - margin: 0
      - padding: 0
    card:
      - "--ha-card-background": transparent
      - background: none
      - background-color: transparent
      - box-shadow: none
      - border: none
      - pointer-events: all
      - height: 22px
      - min-height: 22px
      - display: grid
      - align-items: center
      - padding: 0
      - margin: 0
      - animation: none
      # Hidden while logo hold clone is painted (homio-header-persist.js).
      - opacity: var(--homio-logo-live-opacity, 1)
