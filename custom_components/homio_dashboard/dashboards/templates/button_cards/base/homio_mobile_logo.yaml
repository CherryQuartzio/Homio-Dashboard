homio_mobile_logo:
  # Keep in sync with homio_logo — mobile hamburger uses this separate template.
  # Do not template homio_default — its fadeIn fights logo persist.
  name: HOMIO.
  tap_action:
    action: navigate
    navigation_path: /homio_dashboard/living
  styles:
    grid:
      - grid-template-areas: '"n"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      - place-items: center start
      - height: 100%
      - width: 100%
    name:
      - color: var(--primary-text-color)
      - letter-spacing: 2px
      - font-size: 18px
      - font-weight: 700
      - text-transform: uppercase
      - justify-self: start
      - align-self: center
      - line-height: 1
      - margin: 0
      - padding: 0
    card:
      - "--mdc-ripple-color": transparent
      - "-webkit-tap-highlight-color": transparent
      - "--ha-card-background": transparent
      - background: none
      - background-color: transparent
      - box-shadow: none
      - border: none
      - border-radius: 0
      - position: relative
      - pointer-events: all
      # Fill the 23px mobile header band; text centered via grid.
      - height: 23px
      - min-height: 23px
      - width: auto
      - display: grid
      - align-items: center
      - place-content: center start
      - padding: 0
      - margin: 0
      - animation: none
      - transition: none
      # Invisible hit-target; www/homio-header-persist.js paints the visible logo.
      - opacity: 0
  extra_styles: |
    :host,
    ha-card,
    .button-card-main {
      animation: none !important;
      transition: none !important;
      opacity: 0 !important;
      display: grid !important;
      align-items: center !important;
      height: 23px !important;
      min-height: 23px !important;
    }
    #name {
      align-self: center !important;
      line-height: 1 !important;
      margin: 0 !important;
      padding: 0 !important;
      animation: none !important;
      transition: none !important;
    }
