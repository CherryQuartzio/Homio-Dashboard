homio_light:
  template:
    - homio_entity
  show_last_changed: false
  state_display: |
    [[[
      if (entity.state === "on" && entity.attributes.brightness) {
        return "Brightness - " + Math.round((entity.attributes.brightness / 255) * 100) + "%";
      }
      return "Off";
    ]]]
  tap_action:
    action: toggle
  hold_action:
    action: more-info
  styles:
    label:
      - position: absolute
      - bottom: 25px
      - font-size: 10px
      - text-transform: uppercase
      - color: white
      - letter-spacing: 2px
      - font-weight: 600
      - opacity: 1
      - justify-self: start
    custom_fields:
      light-slider:
        - position: absolute
        - bottom: 30px
        - height: 8px
        - right: 0
        - left: 0
        # Match card horizontal padding so the track spans the full content box.
        - padding: 0 28px
        - pointer-events: all
        - z-index: 6
        - transition: |
            [[[
              if (entity.state === "off" || entity.state === "unavailable")
                return "transform 0s";
              return "transform 0.6s";
            ]]]
        - transform: |
            [[[
              if (entity.state === "off" || entity.state === "unavailable")
                return "translateY(45px)";
              return "translateY(0)";
            ]]]
  custom_fields:
    light-slider:
      card:
        type: "custom:my-slider-v2"
        entity: |
          [[[
            return entity.entity_id;
          ]]]
        allowTapping: false
        allowSliding: true
        styles:
          card:
            - height: 100%
            - margin: 0
            - border-radius: 0px
            - border: none
            - background: transparent
            - box-shadow: none
          track:
            - background: hsl(0 0% 98%)
            - border-radius: 20px
            - box-shadow: none
          container:
            - border-radius: 0
            - overflow: visible
            - box-shadow: none
          progress:
            - background: hsl(0 0% 75%)
            - border-top-left-radius: 20px
            - border-bottom-left-radius: 20px
            - box-shadow: none
          thumb:
            - display: block
            - width: 16px
            - height: 16px
            - border-radius: 50%
            - background: white
            - transform: translateY(-4px)
            # Knob only — rail/track must stay flat (no elevation).
            - box-shadow: 2px 0 8px 2px rgba(0, 0, 0, 0.15)
