homio_thermostat:
  template:
    - homio_entity
  show_entity_picture: false
  show_icon: false
  show_label: true
  label: |
    [[[
      if (!entity || !entity.attributes) return '';
      const t = entity.attributes.current_temperature;
      return (t == null) ? '' : ('Actual ' + t + '°');
    ]]]
  state_display: |
    [[[
      if (!entity) return '';
      const tgt = entity.attributes && entity.attributes.temperature;
      if (entity.state === 'heat') return 'Heating to ' + tgt + '°';
      if (entity.state === 'cool') return 'Cooling to ' + tgt + '°';
      if (entity.state === 'heat_cool') return 'Auto ' + tgt + '°';
      return 'Off';
    ]]]
  tap_action:
    action: call-service
    service: input_boolean.toggle
    service_data:
      entity_id: input_boolean.homio_heating_control
  hold_action:
    action: more-info
    # Nested custom_fields cards don't carry config.entity; bind explicitly.
    entity: |
      [[[ return entity.entity_id; ]]]
  # Override homio_entity heat/cool highlight: only when actively heating/cooling.
  state:
    - value: heat
      styles:
        card:
          - background: |
              [[[
                const a = entity.attributes && entity.attributes.hvac_action;
                return a === "heating" ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.1)";
              ]]]
    - value: cool
      styles:
        card:
          - background: |
              [[[
                const a = entity.attributes && entity.attributes.hvac_action;
                return a === "cooling" ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.1)";
              ]]]
    - value: heat_cool
      styles:
        card:
          - background: |
              [[[
                const a = entity.attributes && entity.attributes.hvac_action;
                return (a === "heating" || a === "cooling")
                  ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.1)";
              ]]]
    - value: auto
      styles:
        card:
          - background: |
              [[[
                const a = entity.attributes && entity.attributes.hvac_action;
                return (a === "heating" || a === "cooling")
                  ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.1)";
              ]]]
  styles:
    name:
      - opacity: |
          [[[ return states["input_boolean.homio_heating_control"].state === "on" ? "0" : "1" ]]]
      - transition: opacity 0.3s
    state:
      - opacity: |
          [[[ return states["input_boolean.homio_heating_control"].state === "on" ? "0" : "0.8" ]]]
      - transition: opacity 0.3s
    label:
      - position: absolute
      - bottom: 25px
      - font-size: 10px
      - text-transform: uppercase
      - color: white
      - letter-spacing: 2px
      - font-weight: 600
      - opacity: 1
      - justify-self: start
    custom_fields:
      heating_modes:
        - position: absolute
        - right: 0
        - top: 0
        - width: 60px
        - height: 170px
        - touch-action: manipulation
        - transition: all 0.3s
        # Mode buttons set pointer-events:all which re-enables hits under a
        # pointer-events:none parent — so also drop z-index + visibility.
        - z-index: |
            [[[ return states["input_boolean.homio_heating_control"].state === "on" ? "1" : "10" ]]]
        - visibility: |
            [[[ return states["input_boolean.homio_heating_control"].state === "on" ? "hidden" : "visible" ]]]
        - pointer-events: |
            [[[ return states["input_boolean.homio_heating_control"].state === "on" ? "none" : "auto" ]]]
        - opacity: |
            [[[ return states["input_boolean.homio_heating_control"].state === "on" ? "0" : "1" ]]]
      target_temperature:
        - position: absolute
        - top: 0
        - left: 0
        - width: 100%
        - height: 100%
        - transition: all 0.3s
        - z-index: |
            [[[ return states["input_boolean.homio_heating_control"].state === "on" ? "12" : "1" ]]]
        - opacity: |
            [[[ return states["input_boolean.homio_heating_control"].state === "on" ? "1" : "0" ]]]
        - pointer-events: |
            [[[ return states["input_boolean.homio_heating_control"].state === "on" ? "auto" : "none" ]]]
  custom_fields:
    heating_modes:
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 60px
          grid-auto-rows: 1fr
          margin: 0
          height: 170px
          padding: 0
        cards:
          - type: custom:button-card
            template:
              - homio_default
            show_entity_picture: true
            entity_picture: /homio_assets/icons/power_off.svg
            hold_action:
              action: none
            tap_action:
              action: call-service
              service: climate.set_hvac_mode
              data:
                entity_id: |
                  [[[
                    return entity.entity_id;
                  ]]]
                hvac_mode: "off"
            styles:
              card:
                - height: 100%
                - animation: none
                - z-index: 2
                - touch-action: manipulation
                - background: |
                    [[[ return entity.state === 'off' ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.1)'; ]]]
              img_cell:
                - width: 19px
              icon:
                - width: 100%
                - height: 100%
            extra_styles: |
              :host, ha-card, .button-card-main {
                touch-action: manipulation !important;
              }
              @media (hover: hover) {
                .button-card-main:hover {
                  box-shadow: inset 0 0 0 999px rgba(255,255,255,0.12);
                }
              }
              .button-card-main:active {
                box-shadow: none;
                background: rgba(255,255,255,0.4) !important;
              }
          - type: custom:button-card
            template:
              - homio_default
            show_entity_picture: true
            entity_picture: /homio_assets/icons/dehumidifier.svg
            hold_action:
              action: none
            tap_action:
              action: call-service
              service: climate.set_hvac_mode
              data:
                entity_id: |
                  [[[
                    return entity.entity_id;
                  ]]]
                hvac_mode: "cool"
            styles:
              card:
                - height: 100%
                - animation: none
                - z-index: 2
                - pointer-events: all
                - touch-action: manipulation
                - background: |
                    [[[ return entity.state === 'cool' ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.1)'; ]]]
              img_cell:
                - width: 19px
              icon:
                - width: 100%
                - height: 100%
            extra_styles: |
              :host, ha-card, .button-card-main {
                touch-action: manipulation !important;
              }
              @media (hover: hover) {
                .button-card-main:hover {
                  box-shadow: inset 0 0 0 999px rgba(255,255,255,0.12);
                }
              }
              .button-card-main:active {
                box-shadow: none;
                background: rgba(255,255,255,0.4) !important;
              }
          - type: custom:button-card
            template:
              - homio_default
            show_entity_picture: true
            entity_picture: /homio_assets/icons/heating.svg
            hold_action:
              action: none
            tap_action:
              action: call-service
              service: climate.set_hvac_mode
              data:
                entity_id: |
                  [[[
                    return entity.entity_id;
                  ]]]
                hvac_mode: "heat"
            styles:
              card:
                - height: 100%
                - animation: none
                - z-index: 2
                - pointer-events: all
                - touch-action: manipulation
                - background: |
                    [[[ return entity.state === 'heat' ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.1)'; ]]]
              img_cell:
                - width: 19px
              icon:
                - width: 100%
                - height: 100%
            extra_styles: |
              :host, ha-card, .button-card-main {
                touch-action: manipulation !important;
              }
              @media (hover: hover) {
                .button-card-main:hover {
                  box-shadow: inset 0 0 0 999px rgba(255,255,255,0.12);
                }
              }
              .button-card-main:active {
                box-shadow: none;
                background: rgba(255,255,255,0.4) !important;
              }
    target_temperature:
      card:
        type: "custom:button-card"
        # Use default — not homio_entity — so heat/cool highlight isn't stacked on the parent.
        template:
          - homio_default
        entity: |
          [[[ return entity.entity_id; ]]]
        show_entity_picture: false
        show_icon: false
        # Original (homio_entity) showed state; keep that without inheriting heat/cool chrome.
        show_state: true
        triggers_update:
          - input_number.homio_thermostat_target_temperature
        name: Target Temp
        state_display: |
          [[[
            return states['input_number.homio_thermostat_target_temperature'].state + "°"
          ]]]
        tap_action:
          action: call-service
          service: input_boolean.toggle
          service_data:
            entity_id: input_boolean.homio_heating_control
        hold_action:
          action: more-info
          entity: |
            [[[ return entity.entity_id; ]]]
        styles:
          card:
            - background: transparent
            - backdrop-filter: none
            - animation: none
            - height: 170px
            - padding-left: 28px
            - padding-right: 28px
            # Soft parent-like ripple on the overlay body (not on ↑/SET/↓).
            - "--ha-ripple-hover-opacity": 0.08
            - "--ha-ripple-pressed-opacity": 0.12
            - "--mdc-ripple-hover-opacity": 0.04
            - "--mdc-ripple-press-opacity": 0.12
            - "--ha-ripple-color": rgba(255,255,255,0.35)
            - "--mdc-ripple-color": rgba(255,255,255,0.35)
          name:
            - justify-self: start
            - text-align: left
            - font-size: 16px
            - font-weight: 600
          state:
            - justify-self: start
            - text-align: left
            - font-size: 14px
            - font-weight: 700
            - opacity: 0.8
          custom_fields:
            temperature_controls:
              - position: absolute
              - top: 0
              - right: 0
              - width: 60px
              - height: 170px
              - z-index: 10
              - touch-action: manipulation
              - pointer-events: all
        extra_styles: |
          /* temperature_controls lives in this card's tree — suppress overlay ripple there.
             Hover suppress is desktop-only (iOS sticky :hover). */
          ha-card:has(#temperature_controls:active) {
            --ha-ripple-hover-opacity: 0 !important;
            --ha-ripple-pressed-opacity: 0 !important;
            --mdc-ripple-hover-opacity: 0 !important;
            --mdc-ripple-press-opacity: 0 !important;
          }
          ha-card:has(#temperature_controls:active) > ha-ripple {
            opacity: 0 !important;
            pointer-events: none !important;
          }
          @media (hover: hover) {
            ha-card:has(#temperature_controls:hover) {
              --ha-ripple-hover-opacity: 0 !important;
              --ha-ripple-pressed-opacity: 0 !important;
              --mdc-ripple-hover-opacity: 0 !important;
              --mdc-ripple-press-opacity: 0 !important;
            }
            ha-card:has(#temperature_controls:hover) > ha-ripple {
              opacity: 0 !important;
              pointer-events: none !important;
            }
          }
        custom_fields:
          temperature_controls:
            card:
              type: "custom:layout-card"
              layout_type: "custom:grid-layout"
              layout:
                grid-template-columns: 60px
                grid-template-rows: "repeat(3,1fr)"
                height: 170px
                margin: 0
                padding: 0
                position: absolute
                inset: auto 0 auto auto
              cards:
                - type: "custom:button-card"
                  template:
                    - homio_default
                  show_entity_picture: true
                  entity_picture: /homio_assets/icons/increase.svg
                  hold_action:
                    action: none
                  tap_action:
                    action: call-service
                    service: input_number.increment
                    service_data:
                      entity_id: input_number.homio_thermostat_target_temperature
                  styles:
                    card:
                      - height: 100%
                      - background: "rgba(255,255,255,0.1)"
                      - animation: none
                      - touch-action: manipulation
                    img_cell:
                      - width: 30%
                    icon:
                      - transform: rotate(-90deg)
                  extra_styles: |
                    :host, ha-card, .button-card-main {
                      touch-action: manipulation !important;
                    }
                    @media (hover: hover) {
                      .button-card-main:hover {
                        box-shadow: inset 0 0 0 999px rgba(255,255,255,0.12);
                      }
                    }
                    .button-card-main:active {
                      box-shadow: none;
                      background: rgba(255,255,255,0.4) !important;
                    }
                - type: "custom:button-card"
                  template:
                    - homio_default
                  name: Set
                  hold_action:
                    action: none
                  tap_action:
                    action: call-service
                    service: climate.set_temperature
                    service_data:
                      entity_id: |
                        [[[
                          return entity.entity_id
                        ]]]
                      temperature: |
                        [[[
                          return parseFloat(states['input_number.homio_thermostat_target_temperature'].state);
                        ]]]
                  styles:
                    card:
                      - height: 100%
                      - background: "rgba(255,255,255,0.1)"
                      - animation: none
                      - border-top: "0.5px solid rgba(255,255,255,0.2)"
                      - border-bottom: "0.5px solid rgba(255,255,255,0.2)"
                      - touch-action: manipulation
                    name:
                      - font-size: 10px
                      - letter-spacing: 2px
                      - text-transform: uppercase
                      - font-weight: 600
                  extra_styles: |
                    :host, ha-card, .button-card-main {
                      touch-action: manipulation !important;
                    }
                    @media (hover: hover) {
                      .button-card-main:hover {
                        box-shadow: inset 0 0 0 999px rgba(255,255,255,0.12);
                      }
                    }
                    .button-card-main:active {
                      box-shadow: none;
                      background: rgba(255,255,255,0.4) !important;
                    }
                - type: "custom:button-card"
                  template:
                    - homio_default
                  show_entity_picture: true
                  entity_picture: /homio_assets/icons/decrease.svg
                  hold_action:
                    action: none
                  tap_action:
                    action: call-service
                    service: input_number.decrement
                    service_data:
                      entity_id: input_number.homio_thermostat_target_temperature
                  styles:
                    card:
                      - height: 100%
                      - background: "rgba(255,255,255,0.1)"
                      - animation: none
                      - touch-action: manipulation
                    img_cell:
                      - width: 30%
                    icon:
                      - transform: rotate(-90deg)
                  extra_styles: |
                    :host, ha-card, .button-card-main {
                      touch-action: manipulation !important;
                    }
                    @media (hover: hover) {
                      .button-card-main:hover {
                        box-shadow: inset 0 0 0 999px rgba(255,255,255,0.12);
                      }
                    }
                    .button-card-main:active {
                      box-shadow: none;
                      background: rgba(255,255,255,0.4) !important;
                    }
