homio_room:
  triggers_update: all
  variables:
    show_motion: false
    motion_sensor: null
    show_temp: false
    temp_sensor: null
    show_humid: false
    humid_sensor: null
  template:
    - homio_default
  tap_action:
    action: call-service
    service: input_boolean.toggle
    service_data:
      entity_id: input_boolean.homio_mobile_navigation
  extra_styles: |
    @media only screen and (max-width: 1249px) {
      .button-card-main {
        position: fixed !important;
      }
    }
    @media (min-width: 1250px) {
      #mobile_logo { display: none !important; }
    }
    ha-ripple,
    .mdc-ripple-surface::before,
    .mdc-ripple-surface::after {
      display: none !important;
      opacity: 0 !important;
      background: transparent !important;
    }
    ha-card:hover,
    ha-card:active,
    ha-card:focus {
      filter: none !important;
      box-shadow: none !important;
      outline: none !important;
    }
  styles:
    card:
      - filter: none
      - --ha-ripple-pressed-opacity: 0
      - --ha-ripple-hover-opacity: 0
      - --ha-ripple-color: transparent
      - --mdc-ripple-press-opacity: 0
      - --mdc-ripple-hover-opacity: 0
      - --mdc-ripple-color: transparent
      - height: 100dvh
      - padding-left: 8vw
      - overflow: hidden
      - box-sizing: border-box
      - max-height: 100dvh
      - pointer-events: |
          [[[
            const nav = states['input_boolean.homio_mobile_navigation'];
            return (nav && nav.state === 'on') ? 'all' : 'none';
          ]]]
      # Spaces after rgba(...) required — Chromium rejects )0% color-stops and drops the whole background.
      - background: |
          [[[
            const img = variables.image || 'lounge';
            const pos = variables.image_position || 'center center';
            return `linear-gradient(to bottom, rgba(51,51,51,0.7) 0%, rgba(51,51,51,0.7) 50%, rgba(51,51,51,0.5) 100%), url('/homio_dashboard/images/Homio/rooms/${img}.jpg') ${pos} / cover no-repeat`;
          ]]]
    name:
      - color: var(--primary-text-color)
      - opacity: 0.9
      - font-size: "clamp(40px, 6.897vw + 17.931px, 80px)"
      - letter-spacing: "-2px"
      - font-weight: 700
      - justify-self: start
    grid:
      - grid-template-columns: 1fr
      - grid-template-rows: min-content
      - grid-template-areas: '"temperature" "n" "humidity"'
      - place-content: center
    custom_fields:
      motion_detection:
        - display: |
            [[[
              return (variables.show_motion && variables.motion_sensor) ? 'block' : 'none';
            ]]]
        - position: fixed
        - right: 0
        - left: 0
        - bottom: 0
        - transform: |
            [[[
              if (!variables.show_motion || !variables.motion_sensor || !states[variables.motion_sensor]) {
                return 'translateY(100%)';
              }
              return states[variables.motion_sensor].state === 'on'
                ? 'translateY(0)'
                : 'translateY(100%)';
            ]]]
        - transition: transform 0.5s
        - padding: 20px
        - color: white
        - font-size: 13px
        - text-transform: uppercase
        - letter-spacing: 2px
        - font-weight: 700
        - background: rgba(255,255,255,0.1)
        - backdrop-filter: blur(12px)
        - z-index: 999
      temperature:
        - display: |
            [[[
              return (variables.show_temp && variables.temp_sensor && states[variables.temp_sensor])
                ? 'block'
                : 'none';
            ]]]
        - color: var(--primary-text-color)
        - font-size: 15px
        - font-weight: 600
        - opacity: 0.9
        - justify-self: start
        - letter-spacing: 1px
        - text-transform: uppercase
      humidity:
        - display: |
            [[[
              return (variables.show_humid && variables.humid_sensor && states[variables.humid_sensor])
                ? 'block'
                : 'none';
            ]]]
        - font-size: "clamp(16px, 1.75vw, 19px)"
        - justify-self: start
        - font-weight: 500
        - margin-top: 10px
        - margin-left: 5px
        - color: var(--primary-text-color)
        - opacity: 0.9
      mobile_logo:
        - position: absolute
        - top: 60px
        - left: 8vw
        - z-index: 999
        - display: |
            [[[
              if (window.innerWidth >= 1250) return 'none';
              const nav = states['input_boolean.homio_mobile_navigation'];
              return (nav && nav.state === 'on') ? 'none' : 'block';
            ]]]
      mobile_menu_icon:
        - position: absolute
        - top: 60px
        - right: 8vw
        - z-index: 999
      navigation:
        - position: absolute
        - inset: 0
        - z-index: 20
        - pointer-events: none
      entities:
        - position: absolute
        - inset: 0
        - pointer-events: none
        - z-index: 5
  custom_fields:
    mobile_logo:
      card:
        type: "custom:button-card"
        template:
          - homio_default
          - homio_mobile_logo
    mobile_menu_icon:
      card:
        type: "custom:button-card"
        template:
          - homio_default
          - homio_menu_icon
    navigation:
      card: !include ../../includes/homio_navigation.yaml
    temperature: |
      [[[
        if (!variables.show_temp || !variables.temp_sensor || !states[variables.temp_sensor]) return '';
        const eid = variables.temp_sensor;
        const st = states[eid];
        const isClimate = String(eid).indexOf('climate.') === 0;
        let temperatureValue;
        let unit;
        if (isClimate) {
          temperatureValue = parseFloat(st.attributes && st.attributes.current_temperature);
          unit = '°C';
        } else {
          temperatureValue = parseFloat(st.state);
          unit = (st.attributes && st.attributes.unit_of_measurement) ? st.attributes.unit_of_measurement : '°';
        }
        if (isNaN(temperatureValue)) return '';
        const temperature = temperatureValue.toFixed(1);
        const isF = String(unit).indexOf('F') !== -1;
        let label = '';
        if (isF) {
          if (temperatureValue <= 60) label = 'Very Cold';
          else if (temperatureValue <= 67) label = 'Cool';
          else if (temperatureValue <= 74) label = 'Comfortable';
          else label = 'Very Hot';
        } else {
          if (temperatureValue <= 15.99) label = 'Very Cold';
          else if (temperatureValue <= 17.99) label = 'Cool';
          else if (temperatureValue <= 20.99) label = 'Comfortable';
          else label = 'Very Hot';
        }
        return temperature + unit + ' - ' + label;
      ]]]
    humidity: |
      [[[
        if (!variables.show_humid || !variables.humid_sensor || !states[variables.humid_sensor]) return '';
        const humidityValue = parseFloat(states[variables.humid_sensor].state);
        if (isNaN(humidityValue)) return '';
        const humidity = humidityValue.toFixed(0);
        if (humidityValue <= 29.99) return 'Humidity is very dry at ' + humidity + '%';
        if (humidityValue <= 60.99) return 'Humidity is good at ' + humidity + '%';
        return 'Humidity is high at ' + humidity + '%';
      ]]]
    motion_detection: |
      [[[
        return 'Motion detected';
      ]]]
