homio_room:
  triggers_update: all
  variables:
    show_motion: false
    motion_sensor: null
    show_temp: false
    temp_sensor: null
    show_humid: false
    humid_sensor: null
  template:
    - homio_default
  # Menu open/close is per-browser (homio-menu-nav.js), not a shared HA entity.
  tap_action:
    action: fire-dom-event
    homio_action: menu_toggle
  extra_styles: |
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes homioRoomBgFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    /* Always fill the relative view. Do not toggle absolute only under 1249px —
       that flashed gray at the header swap; leaving flow without fill shrink-wrapped
       the room to ~half width. Never use position:fixed (viewport, ignores HA rail). */
    :host {
      display: block !important;
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      max-width: none !important;
      height: 100% !important;
      box-sizing: border-box !important;
    }
    .button-card-main {
      width: 100% !important;
      max-width: none !important;
      height: 100% !important;
      box-sizing: border-box !important;
      position: relative !important;
      z-index: 1 !important;
    }
    /* Background fades on its own layer so nav/logo/entities are unaffected. */
    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: var(--homio-room-surface);
      animation: homioRoomBgFade 0.2s ease-out forwards;
    }
    /* Full vs compact header is per-browser via CSS vars from homio-header-fit.js
       (never a shared input_boolean — that synced every client). */
    /* Room text lift: var set on documentElement by homio-room-text-fit.js.
       Title + sensors fade like entity cards; logo/nav stay still. */
    #temperature,
    #name,
    #humidity {
      position: relative !important;
      z-index: 2 !important;
      animation: fadeIn 0.3s ease-in forwards !important;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1) !important;
      transform: translateY(calc(-1 * var(--homio-room-text-lift, 0px))) !important;
    }
    ha-ripple,
    .mdc-ripple-surface::before,
    .mdc-ripple-surface::after {
      display: none !important;
      opacity: 0 !important;
      background: transparent !important;
    }
    ha-card:hover,
    ha-card:active,
    ha-card:focus {
      filter: none !important;
      box-shadow: none !important;
      outline: none !important;
    }
    /* Pin overlays — button-card string styles on custom_fields can fail to
       apply; without absolute, place-content:center dumps the menu mid-screen. */
    #mobile_logo {
      position: absolute !important;
      /* Match burger band: 23px tall @ 57.5px so logo text centers with the icon. */
      top: 57.5px !important;
      left: 8vw !important;
      height: 23px !important;
      z-index: 999 !important;
      /* Must honor hide-when-full-header — do NOT force flex here. */
      display: var(--homio-mobile-logo-display, none) !important;
      align-items: center !important;
      /* Overlay paints the logo — never fade this slot with the room title. */
      opacity: var(--homio-logo-live-opacity, 1) !important;
      transition: none !important;
      animation: none !important;
    }
    #mobile_logo button-card,
    #mobile_logo > * {
      height: 23px !important;
      align-items: center !important;
    }
    #mobile_menu_icon {
      position: absolute !important;
      /* 28×23 burger; shared center line with mobile logo @ 57.5 + 11.5 = 69px */
      top: 57.5px !important;
      right: 8vw !important;
      z-index: 999 !important;
      width: 28px !important;
      height: 23px !important;
    }
  styles:
    card:
      - filter: none
      - --ha-ripple-pressed-opacity: 0
      - --ha-ripple-hover-opacity: 0
      - --ha-ripple-color: transparent
      - --mdc-ripple-press-opacity: 0
      - --mdc-ripple-hover-opacity: 0
      - --mdc-ripple-color: transparent
      - height: 100%
      - width: 100%
      - max-width: none
      - max-height: 100%
      - padding-left: 8vw
      - overflow: hidden
      - box-sizing: border-box
      # Room chrome must not fadeIn — nav/logo stay still. Background fades via
      # ha-card::before; title/temp/humidity fade via #name/#temperature/#humidity.
      - animation: none
      # Solid base while the photo layer fades in (avoids a blank flash).
      - background: "rgb(51, 51, 51)"
      - background-color: "rgb(51, 51, 51)"
      - pointer-events: var(--homio-room-pointer-events, none)
      # Spaces after rgba(...) required — Chromium rejects )0% color-stops and drops the whole background.
      - "--homio-room-surface": |
          [[[
            const img = variables.image || 'lounge';
            const pos = variables.image_position || 'center center';
            return `linear-gradient(to bottom, rgba(51,51,51,0.7) 0%, rgba(51,51,51,0.7) 50%, rgba(51,51,51,0.5) 100%), url('/homio_assets/rooms/${img}.jpg') ${pos} / cover no-repeat`;
          ]]]
    name:
      - color: var(--primary-text-color)
      - opacity: 0.9
      - font-size: "clamp(40px, 6.897vw + 17.931px, 80px)"
      - letter-spacing: "-2px"
      - font-weight: 700
      - justify-self: start
      # Optical align with temperature left edge (display type side-bearings).
      - margin-left: "-5px"
      - padding-left: 0
    grid:
      - grid-template-columns: 1fr
      - grid-template-rows: min-content
      - grid-template-areas: '"temperature" "n" "humidity"'
      - height: 100%
      - box-sizing: border-box
      # Stay vertically centered; homio-room-text-fit.js lifts #temperature/#name/#humidity
      # only when they would collide with the entity strip (smooth, per-browser).
      - place-content: center
    custom_fields:
      motion_detection:
        - display: |
            [[[
              return (variables.show_motion && variables.motion_sensor) ? 'block' : 'none';
            ]]]
        - position: fixed
        - right: 0
        - left: 0
        - bottom: 0
        - transform: |
            [[[
              if (!variables.show_motion || !variables.motion_sensor || !states[variables.motion_sensor]) {
                return 'translateY(100%)';
              }
              return states[variables.motion_sensor].state === 'on'
                ? 'translateY(0)'
                : 'translateY(100%)';
            ]]]
        - transition: transform 0.5s
        - padding: 20px
        - color: white
        - font-size: 13px
        - text-transform: uppercase
        - letter-spacing: 2px
        - font-weight: 700
        - background: rgba(255,255,255,0.1)
        - backdrop-filter: blur(12px)
        - z-index: 999
      temperature:
        - display: |
            [[[
              return (variables.show_temp && variables.temp_sensor && states[variables.temp_sensor])
                ? 'block'
                : 'none';
            ]]]
        - color: var(--primary-text-color)
        - font-size: 15px
        - font-weight: 600
        - opacity: 0.9
        - justify-self: start
        - letter-spacing: 1px
        - text-transform: uppercase
      humidity:
        - display: |
            [[[
              return (variables.show_humid && variables.humid_sensor && states[variables.humid_sensor])
                ? 'block'
                : 'none';
            ]]]
        - font-size: "clamp(16px, 1.75vw, 19px)"
        - justify-self: start
        - font-weight: 500
        - margin-top: 10px
        # Was 5px — sat right of the temperature left edge.
        - margin-left: 0
        - color: var(--primary-text-color)
        - opacity: 0.9
      mobile_logo:
        - position: absolute
        - top: 57.5px
        - left: 8vw
        - height: 23px
        - z-index: 999
        # Compact + menu-closed only (homio-menu-nav.js).
        - display: var(--homio-mobile-logo-display, none)
      mobile_menu_icon:
        - position: absolute
        # Shared vertical band with mobile_logo (23px @ 57.5px).
        - top: 57.5px
        - right: 8vw
        - z-index: 999
        - height: 23px
        - width: 28px
      navigation:
        - position: absolute
        - inset: 0
        - z-index: 20
        - pointer-events: none
      entities:
        # Full-room overlay (stock Homio). Inner layout-card uses bottom inset.
        # iOS touch-pan is enabled on layout #root by homio-entity-strip.js —
        # do not switch this to a bottom band (button-card can pin that to top).
        - position: absolute
        - inset: 0
        - pointer-events: none
        - z-index: 5

  custom_fields:
    mobile_logo:
      card:
        type: "custom:button-card"
        template:
          - homio_default
          - homio_mobile_logo
    mobile_menu_icon:
      card:
        type: "custom:button-card"
        template:
          - homio_default
          - homio_menu_icon
    navigation:
      card: !include ../../includes/homio_navigation.yaml
    temperature: |
      [[[
        if (!variables.show_temp || !variables.temp_sensor || !states[variables.temp_sensor]) return '';
        const eid = variables.temp_sensor;
        const st = states[eid];
        const ht = window.homioTemp;
        let temperatureValue;
        let unit;
        if (ht) {
          const isClimate = String(eid).indexOf('climate.') === 0;
          const converted = isClimate
            ? ht.fromClimate(hass, st, 'current_temperature')
            : ht.fromSensor(hass, st);
          temperatureValue = converted.value;
          unit = converted.unit;
        } else {
          // Fallback if homio-temp.js has not loaded yet.
          const isClimate = String(eid).indexOf('climate.') === 0;
          if (isClimate) {
            temperatureValue = parseFloat(st.attributes && st.attributes.current_temperature);
            unit = (hass.config && hass.config.unit_system && hass.config.unit_system.temperature)
              || (st.attributes && st.attributes.temperature_unit)
              || '°C';
          } else {
            temperatureValue = parseFloat(st.state);
            unit = (st.attributes && st.attributes.unit_of_measurement)
              || (hass.config && hass.config.unit_system && hass.config.unit_system.temperature)
              || '°';
          }
        }
        if (isNaN(temperatureValue)) return '';
        const temperature = temperatureValue.toFixed(1);
        const label = ht
          ? ht.comfortLabel(temperatureValue, unit)
          : (String(unit).indexOf('F') !== -1
              ? (temperatureValue <= 60 ? 'Very Cold' : temperatureValue <= 67 ? 'Cool' : temperatureValue <= 74 ? 'Comfortable' : 'Very Hot')
              : (temperatureValue <= 15.99 ? 'Very Cold' : temperatureValue <= 17.99 ? 'Cool' : temperatureValue <= 20.99 ? 'Comfortable' : 'Very Hot'));
        return temperature + unit + ' - ' + label;
      ]]]
    humidity: |
      [[[
        if (!variables.show_humid || !variables.humid_sensor || !states[variables.humid_sensor]) return '';
        const humidityValue = parseFloat(states[variables.humid_sensor].state);
        if (isNaN(humidityValue)) return '';
        const humidity = humidityValue.toFixed(0);
        if (humidityValue <= 29.99) return 'Humidity is very dry at ' + humidity + '%';
        if (humidityValue <= 60.99) return 'Humidity is good at ' + humidity + '%';
        return 'Humidity is high at ' + humidity + '%';
      ]]]
    motion_detection: |
      [[[
        return 'Motion detected';
      ]]]
